<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片展示與動畫效果</title>
    <!-- 引入分離的 CSS 檔案 -->
    <link rel="stylesheet" href="U1558017.css">
</head>
<body>

    <header>
        <h1>圖片展示藝廊</h1>
        <p>將滑鼠懸停在圖片上可看到抖動效果，點擊圖片可開啟連結！</p>
    </header>

    <main class="gallery-container">
        <!-- 圖片 1 -->
        <a href="https://example.com/page1" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/400/300?random=1" alt="展示圖片 1">
            <div class="caption">圖片 1</div>
        </a>

        <!-- 圖片 2 -->
        <a href="https://example.com/page2" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/400/300?random=2" alt="展示圖片 2">
            <div class="caption">圖片 2</div>
        </a>

        <!-- 圖片 3 -->
        <a href="https://example.com/page3" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/400/300?random=3" alt="展示圖片 3">
            <div class="caption">圖片 3</div>
        </a>

        <!-- 圖片 4 -->
        <a href="https://example.com/page4" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/400/300?random=4" alt="展示圖片 4">
            <div class="caption">圖片 4</div>
        </a>

        <!-- 圖片 5 -->
        <a href="https://example.com/page5" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/400/300?random=5" alt="展示圖片 5">
            <div class="caption">圖片 5</div>
        </a>
    </main>

</body>
</html>
